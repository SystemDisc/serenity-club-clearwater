services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: serenity
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: serenity_dev
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres:/var/lib/postgresql
      - ./scripts/local-databases.sql:/docker-entrypoint-initdb.d/databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U serenity -d serenity_dev']
      interval: 5s
      retries: 10

volumes:
  postgres:
